<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d1012" />
  <meta name="description" content="Explore the new XUP office interior." />
  <title>XUP Office — Interior Viewer</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23101417'/%3E%3Cpath d='M14 15h11l7 13 7-13h11L37 38v11H27V38z' fill='%23d7e92b'/%3E%3C/svg%3E" />
  <style>
    :root { color-scheme: dark; --acid:#d6e725; --ink:#eef0eb; --muted:#b9bdb6; --panel:rgba(13,16,18,.75); }
    * { box-sizing:border-box; }
    body { margin:0; overflow:hidden; background:#101314; color:var(--ink); font-family:Arial, Helvetica, sans-serif; }
    .viewer { position:relative; width:100vw; height:100svh; overflow:hidden; background:#181b1d; touch-action:none; cursor:grab; }
    .viewer.dragging { cursor:grabbing; }
    .fallback, .panorama { position:absolute; inset:0; width:100%; height:100%; display:block; }
    .fallback { object-fit:cover; object-position:50% 50%; }
    .panorama { opacity:0; transition:opacity .35s ease; }
    .panorama.ready { opacity:1; }
    .topbar { position:absolute; top:0; left:0; right:0; z-index:2; padding:28px clamp(20px,4vw,58px); display:flex; align-items:flex-start; justify-content:space-between; gap:24px; background:linear-gradient(180deg,rgba(0,0,0,.48),transparent); }
    .brand { display:flex; align-items:center; gap:11px; font-size:.76rem; letter-spacing:.16em; font-weight:700; }
    .mark { display:grid; place-items:center; width:30px; height:30px; background:var(--acid); color:#121512; font-size:.8rem; letter-spacing:-.06em; font-weight:900; }
    .scene-name { margin-top:7px; font-size:1.05rem; letter-spacing:.02em; font-weight:500; }
    .instruction { display:flex; align-items:center; gap:9px; margin-top:3px; color:var(--muted); font-size:.78rem; }
    .hand { width:20px; height:20px; border:1px solid var(--muted); border-radius:50%; display:inline-block; }
    .bottom { position:absolute; z-index:2; left:clamp(20px,4vw,58px); right:clamp(20px,4vw,58px); bottom:clamp(22px,4vw,46px); display:flex; align-items:end; justify-content:space-between; gap:30px; }
    .directions { display:flex; gap:8px; flex-wrap:wrap; max-width:600px; }
    button { appearance:none; color:var(--ink); font:inherit; border:1px solid rgba(255,255,255,.34); background:var(--panel); backdrop-filter:blur(10px); cursor:pointer; transition:.2s ease; }
    .direction { min-width:90px; padding:10px 13px; text-align:left; font-size:.77rem; color:var(--muted); }
    .direction strong { display:block; color:inherit; font-size:.66rem; letter-spacing:.13em; text-transform:uppercase; margin-bottom:4px; }
    .direction:hover,.direction:focus-visible { border-color:var(--acid); color:var(--ink); outline:none; }
    .direction.active { background:var(--acid); border-color:var(--acid); color:#111510; }
    .controls { display:flex; align-items:center; gap:8px; }
    .round { width:42px; height:42px; border-radius:50%; font-size:1.35rem; line-height:1; }
    .round:hover,.round:focus-visible { border-color:var(--acid); outline:none; }
    .scene-pill { position:absolute; z-index:3; left:50%; transform:translateX(-50%); bottom:28px; display:flex; align-items:center; gap:11px; padding:8px 13px 8px 9px; border:1px solid rgba(255,255,255,.27); background:var(--panel); backdrop-filter:blur(12px); color:var(--ink); font-size:.76rem; }
    .scene-dot { width:25px; height:25px; background:var(--acid); color:#111510; display:grid; place-items:center; font-size:.67rem; font-weight:700; }
    .drawer { position:absolute; z-index:5; top:18px; right:18px; width:min(355px,calc(100vw - 36px)); padding:20px; border:1px solid rgba(255,255,255,.24); background:rgba(13,16,18,.93); box-shadow:0 16px 50px rgba(0,0,0,.38); transform:translateY(-130%); transition:transform .3s ease; }
    .drawer.open { transform:translateY(0); }
    .drawer h2 { margin:0 0 5px; font-size:1rem; }
    .drawer p { margin:0 0 16px; color:var(--muted); font-size:.78rem; line-height:1.5; }
    .scene-item { display:flex; width:100%; gap:12px; padding:9px; text-align:left; }
    .scene-item.active { border-color:var(--acid); background:rgba(214,231,37,.12); }
    .hotspots { position:absolute; z-index:4; inset:0; pointer-events:none; overflow:hidden; }
    .hotspot { position:absolute; display:flex; align-items:center; gap:9px; max-width:220px; padding:7px 12px 7px 8px; border:1px solid rgba(214,231,37,.9); border-radius:99px; color:var(--ink); background:rgba(12,15,16,.84); box-shadow:0 8px 22px rgba(0,0,0,.24); backdrop-filter:blur(8px); font-size:.76rem; text-align:left; pointer-events:auto; transition:opacity .18s ease,transform .18s ease; }
    .hotspot[hidden] { display:none; }
    .hotspot.annotation { pointer-events:none; border-color:rgba(255,255,255,.52); }
    .hotspot-pin { display:grid; place-items:center; flex:0 0 auto; width:23px; height:23px; border-radius:50%; background:var(--acid); color:#101410; font-size:.8rem; font-weight:800; }
    .hotspot small { display:block; margin-top:2px; color:var(--muted); font-size:.65rem; }
    .auto { height:42px; padding:0 14px; border-radius:24px; font-size:.73rem; font-weight:700; letter-spacing:.04em; }
    .auto.active { color:#101410; border-color:var(--acid); background:var(--acid); }
    .scene-thumb { width:74px; height:48px; object-fit:cover; }
    .scene-item span { display:block; font-size:.72rem; color:var(--muted); margin-top:4px; }
    @media (max-width:680px) { .topbar { padding-top:18px; } .instruction { display:none; } .bottom { flex-direction:column; align-items:stretch; gap:14px; } .directions { display:grid; grid-template-columns:repeat(2,1fr); max-width:none; } .direction { min-width:0; } .controls { align-self:flex-end; } .scene-pill { bottom:auto; top:76px; } }
  </style>
</head>
<body>
  <main class="viewer" id="viewer" aria-label="Interactive XUP office interior panorama">
    <img class="fallback" id="fallback" src="assets/360_Render1.png" alt="Panoramic render of the open workspace" />
    <canvas class="panorama" id="panorama" aria-label="Interactive 360 degree render of the new XUP office interior"></canvas>
    <header class="topbar">
      <div><div class="brand"><span class="mark">XUP</span> OFFICE INTERIOR</div><div class="scene-name" id="sceneName">Open workspace</div></div>
      <div class="instruction"><span class="hand"></span> Drag to look in any direction</div>
    </header>
    <button class="scene-pill" id="sceneToggle" aria-expanded="false" aria-controls="sceneDrawer"><span class="scene-dot" id="sceneNumber">01</span> View scenes</button>
    <aside class="drawer" id="sceneDrawer" aria-label="Available interior scenes">
      <h2>Office scenes</h2><p>Choose a point of view to explore the new office.</p>
      <button class="scene-item active" data-scene="0"><img class="scene-thumb" src="assets/360_Render1.png" alt="" /><div>01 — Open workspace<span>Workstations</span></div></button>
      <button class="scene-item" data-scene="1"><img class="scene-thumb" src="assets/360_Render2.png" alt="" /><div>02 — Reception & entry<span>Arrival area</span></div></button>
      <button class="scene-item" data-scene="2"><img class="scene-thumb" src="assets/360_Render3.png" alt="" /><div>03 — Work lounge<span>Collaboration area</span></div></button>
    </aside>
    <div class="hotspots" id="hotspots" aria-live="polite"></div>
    <div class="bottom">
      <nav class="directions" aria-label="Jump to a viewpoint">
        <button class="direction" data-yaw="-105"><strong>West</strong>Lounge</button>
        <button class="direction active" data-yaw="0"><strong>North</strong>Think wall</button>
        <button class="direction" data-yaw="78"><strong>East</strong>Meeting room</button>
        <button class="direction" data-yaw="155"><strong>South</strong>Reception</button>
      </nav>
      <div class="controls"><button class="auto" id="autoRotate" aria-pressed="false">Auto rotate</button><button class="round" id="zoomOut" aria-label="Zoom out">−</button><button class="round" id="reset" aria-label="Reset view">⌾</button><button class="round" id="zoomIn" aria-label="Zoom in">+</button></div>
    </div>
  </main>
  <script>
    const viewer=document.getElementById('viewer'), canvas=document.getElementById('panorama'), fallback=document.getElementById('fallback'), gl=canvas.getContext('webgl');
    const scenes=[
      {title:'Open workspace',detail:'Workstations',src:'assets/360_Render1.png',alt:'360 degree view of the open workspace',hotspots:[
        {lon:0,lat:-10,label:'Open workspace',detail:'Flexible team desks'},
        {lon:-118,lat:-12,label:'Cozy Corner',detail:'Relaxed seating & informal breaks'},
        {lon:126,lat:-4,label:'Reception & entry',detail:'Enter through this door',target:1},
        {lon:33,lat:-9,label:'Work lounge',detail:'Go to scene 03',target:2}
      ]},
      {title:'Reception & entry',detail:'Arrival area',src:'assets/360_Render2.png',alt:'360 degree view of the reception and entry',hotspots:[
        {lon:-14,lat:-7,label:'Visitor welcome desk',detail:'Reception point'},
        {lon:0,lat:-8,label:'Open workspace',detail:'Go to scene 01',target:0},
        {lon:48,lat:-9,label:'Work lounge',detail:'Go to scene 03',target:2}
      ]},
      {title:'Work lounge',detail:'Collaboration area',src:'assets/360_Render3.png',alt:'360 degree view of the work lounge',hotspots:[
        {lon:22,lat:-9,label:'Informal lounge',detail:'Relaxed collaboration zone'},
        {lon:0,lat:-7,label:'Open workspace',detail:'Go to scene 01',target:0},
        {lon:-45,lat:-9,label:'Reception & entry',detail:'Go to scene 02',target:1}
      ]}
    ];
    let currentScene=0;
    const buttons=[...document.querySelectorAll('.direction')], hotspotLayer=document.getElementById('hotspots'), autoButton=document.getElementById('autoRotate'); let yaw=0, pitch=0, fov=70, targetYaw=0, targetPitch=0, targetFov=70, autoRotate=false, dragging=false, startX, startY, originYaw, originPitch, dragAxis, animationFrame;
    const vertex=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
    const fragment=`precision highp float;uniform sampler2D pano;uniform vec2 resolution;uniform float yaw;uniform float pitch;uniform float fov;const float PI=3.141592653589793;void main(){vec2 screen=(gl_FragCoord.xy/resolution-.5)*2.;screen.x*=resolution.x/resolution.y;vec3 ray=normalize(vec3(screen,1./tan(radians(fov)*.5)));float cp=cos(pitch),sp=sin(pitch);ray.yz=mat2(cp,-sp,sp,cp)*ray.yz;float cy=cos(yaw),sy=sin(yaw);ray.xz=mat2(cy,-sy,sy,cy)*ray.xz;float longitude=atan(ray.x,ray.z);float latitude=asin(clamp(ray.y,-1.,1.));vec2 uv=vec2(longitude/(2.*PI)+.5,.5-latitude/PI);gl_FragColor=texture2D(pano,uv);}`;
    function shader(type, source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s}
    const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vertex));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fragment));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program));gl.useProgram(program);
    const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const loc=gl.getAttribLocation(program,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    const uniforms={resolution:gl.getUniformLocation(program,'resolution'),yaw:gl.getUniformLocation(program,'yaw'),pitch:gl.getUniformLocation(program,'pitch'),fov:gl.getUniformLocation(program,'fov')};
    const texture=gl.createTexture(), source=new Image();source.onload=()=>{gl.bindTexture(gl.TEXTURE_2D,texture);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,source);if(gl.getError()===gl.NO_ERROR){canvas.classList.add('ready');fallback.setAttribute('aria-hidden','true');if(!animationFrame)animate()}};
    function resize(){const ratio=Math.min(devicePixelRatio||1,2),w=canvas.clientWidth*ratio,h=canvas.clientHeight*ratio;if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h)}}
    function render(){resize();gl.uniform2f(uniforms.resolution,canvas.width,canvas.height);gl.uniform1f(uniforms.yaw,yaw*Math.PI/180);gl.uniform1f(uniforms.pitch,pitch*Math.PI/180);gl.uniform1f(uniforms.fov,fov);gl.drawArrays(gl.TRIANGLES,0,3);positionHotspots()}
    function animate(){if(autoRotate&&!dragging)targetYaw+=.035;yaw+=(targetYaw-yaw)*.12;pitch+=(targetPitch-pitch)*.12;fov+=(targetFov-fov)*.14;render();animationFrame=requestAnimationFrame(animate)}
    function choose(value){targetYaw=+value;targetPitch=0;buttons.forEach(b=>b.classList.toggle('active',+b.dataset.yaw===targetYaw))}
    function buildHotspots(){hotspotLayer.replaceChildren(...scenes[currentScene].hotspots.map((spot,index)=>{const isScene=Number.isInteger(spot.target),node=document.createElement(isScene?'button':'div');node.className=`hotspot${isScene?' scene-hotspot':' annotation'}`;node.dataset.hotspot=index;node.innerHTML=`<span class="hotspot-pin">${isScene?'●':'i'}</span><span>${spot.label}<small>${spot.detail}</small></span>`;if(isScene)node.addEventListener('click',()=>selectScene(spot.target));return node}))}
    function positionHotspots(){const scene=scenes[currentScene];if(!scene)return;const yawRad=yaw*Math.PI/180,pitchRad=pitch*Math.PI/180,cy=Math.cos(yawRad),sy=Math.sin(yawRad),cp=Math.cos(pitchRad),sp=Math.sin(pitchRad),aspect=canvas.clientWidth/canvas.clientHeight,focal=1/Math.tan(fov*Math.PI/360);[...hotspotLayer.children].forEach((node,index)=>{const spot=scene.hotspots[index],lon=spot.lon*Math.PI/180,lat=spot.lat*Math.PI/180;let x=Math.sin(lon)*Math.cos(lat),y=Math.sin(lat),z=Math.cos(lon)*Math.cos(lat);const yawX=cy*x-sy*z,yawZ=sy*x+cy*z;x=yawX;z=yawZ;const pitchY=cp*y-sp*z,pitchZ=sp*y+cp*z;y=pitchY;z=pitchZ;const sx=(x/z)*focal/aspect,syy=(y/z)*focal,visible=z>.05&&Math.abs(sx)<1.12&&Math.abs(syy)<1.12;node.hidden=!visible;if(visible){node.style.left=`${(sx+1)*50}%`;node.style.top=`${(1-syy)*50}%`;node.style.transform='translate(-50%,-50%)'}})}
    function setAutoRotate(enabled){autoRotate=enabled;autoButton.classList.toggle('active',enabled);autoButton.setAttribute('aria-pressed',String(enabled));autoButton.textContent=enabled?'Pause rotation':'Auto rotate';if(enabled)buttons.forEach(button=>button.classList.remove('active'))}
    function selectScene(index){const scene=scenes[index];currentScene=index;setAutoRotate(false);canvas.classList.remove('ready');fallback.removeAttribute('aria-hidden');fallback.src=scene.src;fallback.alt=scene.alt;source.src=scene.src;document.getElementById('sceneName').textContent=scene.title;document.getElementById('sceneNumber').textContent=String(index+1).padStart(2,'0');document.querySelectorAll('.scene-item').forEach(item=>item.classList.toggle('active',+item.dataset.scene===index));yaw=targetYaw=0;pitch=targetPitch=0;fov=targetFov=70;choose(0);buildHotspots()}
    buttons.forEach(button=>button.addEventListener('click',()=>choose(button.dataset.yaw)));
    viewer.addEventListener('pointerdown',event=>{if(event.target.closest('button'))return;setAutoRotate(false);const bounds=viewer.getBoundingClientRect(),edge=Math.min(event.clientX-bounds.left,bounds.right-event.clientX);dragging=true;dragAxis=edge<bounds.width*.18?'horizontal':null;viewer.classList.add('dragging');viewer.setPointerCapture(event.pointerId);startX=event.clientX;startY=event.clientY;originYaw=targetYaw;originPitch=targetPitch});
    viewer.addEventListener('pointermove',event=>{if(!dragging)return;const dx=event.clientX-startX,dy=event.clientY-startY;if(!dragAxis&&Math.hypot(dx,dy)>7)dragAxis=Math.abs(dx)>=Math.abs(dy)?'horizontal':'vertical';if(dragAxis==='horizontal')targetYaw=originYaw-dx*.105;if(dragAxis==='vertical')targetPitch=Math.max(-85,Math.min(85,originPitch-dy*.105));buttons.forEach(b=>b.classList.remove('active'))});
    viewer.addEventListener('pointerup',()=>{dragging=false;viewer.classList.remove('dragging')});
    viewer.addEventListener('wheel',event=>{event.preventDefault();targetFov=Math.max(42,Math.min(92,targetFov+event.deltaY*.025))},{passive:false});
    autoButton.onclick=()=>setAutoRotate(!autoRotate);document.getElementById('zoomIn').onclick=()=>{targetFov=Math.max(42,targetFov-5)};document.getElementById('zoomOut').onclick=()=>{targetFov=Math.min(92,targetFov+5)};document.getElementById('reset').onclick=()=>{targetFov=70;choose(0)};window.addEventListener('resize',render);
    const toggle=document.getElementById('sceneToggle'), drawer=document.getElementById('sceneDrawer'); toggle.onclick=()=>{const open=drawer.classList.toggle('open');toggle.setAttribute('aria-expanded',open)};
    document.querySelectorAll('.scene-item').forEach(item=>item.onclick=()=>{selectScene(+item.dataset.scene);drawer.classList.remove('open');toggle.setAttribute('aria-expanded','false')});
    selectScene(0);
  </script>
</body>
</html>
