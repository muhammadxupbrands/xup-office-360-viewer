<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d1012" />
  <meta name="description" content="Explore the new XUP office interior." />
  <title>XUP Office — Interior Viewer</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23101417'/%3E%3Cpath d='M15 15h10l7 12 7-12h10L38 32l11 17H39l-7-12-7 12H15l11-17z' fill='%23d7e92b'/%3E%3C/svg%3E" />
  <style>
    :root { color-scheme: dark; --acid:#d6e725; --ink:#eef0eb; --muted:#b9bdb6; --panel:rgba(13,16,18,.75); }
    * { box-sizing:border-box; }
    body { margin:0; overflow:hidden; background:#101314; color:var(--ink); font-family:Arial, Helvetica, sans-serif; }
    .viewer { position:relative; width:100vw; height:100svh; overflow:hidden; background:#181b1d; touch-action:none; cursor:grab; }
    .viewer.dragging { cursor:grabbing; }
    .fallback, .panorama, .top-view { position:absolute; inset:0; width:100%; height:100%; display:block; }
    .fallback { object-fit:cover; object-position:50% 50%; }
    .panorama { opacity:0; transition:opacity .35s ease; }
    .panorama.ready { opacity:1; }
    .top-view { object-fit:contain; object-position:center; background:#050607; }
    .top-view[hidden] { display:none; }
    .topbar { position:absolute; top:0; left:0; right:0; z-index:2; padding:28px clamp(20px,4vw,58px); display:flex; align-items:flex-start; justify-content:space-between; gap:24px; background:linear-gradient(180deg,rgba(0,0,0,.48),transparent); }
    .brand { display:flex; align-items:center; gap:11px; font-size:.76rem; letter-spacing:.16em; font-weight:700; }
    .mark { display:grid; place-items:center; width:30px; height:30px; background:var(--acid); color:#121512; font-size:.8rem; letter-spacing:-.06em; font-weight:900; }
    .scene-name { margin-top:7px; font-size:1.05rem; letter-spacing:.02em; font-weight:500; }
    .instruction { display:flex; align-items:center; gap:9px; margin-top:3px; color:var(--muted); font-size:.78rem; }
    .hand { width:20px; height:20px; border:1px solid var(--muted); border-radius:50%; display:inline-block; }
    .bottom { position:absolute; z-index:2; left:clamp(20px,4vw,58px); right:clamp(20px,4vw,58px); bottom:clamp(22px,4vw,46px); display:flex; align-items:end; justify-content:space-between; gap:30px; }
    .directions { display:flex; gap:8px; flex-wrap:wrap; max-width:600px; }
    button { appearance:none; color:var(--ink); font:inherit; border:1px solid rgba(255,255,255,.34); background:var(--panel); backdrop-filter:blur(10px); cursor:pointer; transition:.2s ease; }
    .direction { min-width:90px; padding:10px 13px; text-align:left; font-size:.77rem; color:var(--muted); }
    .direction strong { display:block; color:inherit; font-size:.66rem; letter-spacing:.13em; text-transform:uppercase; margin-bottom:4px; }
    .direction:hover,.direction:focus-visible { border-color:var(--acid); color:var(--ink); outline:none; }
    .direction.active { background:var(--acid); border-color:var(--acid); color:#111510; }
    .controls { display:flex; align-items:center; justify-content:flex-end; gap:8px; flex-wrap:wrap; }
    .round { width:42px; height:42px; border-radius:50%; font-size:1.35rem; line-height:1; }
    .round:hover,.round:focus-visible { border-color:var(--acid); outline:none; }
    .scene-pill { position:absolute; z-index:3; left:50%; transform:translateX(-50%); bottom:28px; display:flex; align-items:center; gap:11px; padding:8px 13px 8px 9px; border:1px solid rgba(255,255,255,.27); background:var(--panel); backdrop-filter:blur(12px); color:var(--ink); font-size:.76rem; }
    .scene-dot { width:25px; height:25px; background:var(--acid); color:#111510; display:grid; place-items:center; font-size:.67rem; font-weight:700; }
    .drawer { position:absolute; z-index:5; top:18px; right:18px; width:min(355px,calc(100vw - 36px)); padding:20px; border:1px solid rgba(255,255,255,.24); background:rgba(13,16,18,.93); box-shadow:0 16px 50px rgba(0,0,0,.38); transform:translateY(-130%); transition:transform .3s ease; }
    .drawer.open { transform:translateY(0); }
    .drawer h2 { margin:0 0 5px; font-size:1rem; }
    .drawer p { margin:0 0 16px; color:var(--muted); font-size:.78rem; line-height:1.5; }
    .scene-item { display:flex; width:100%; gap:12px; padding:9px; text-align:left; }
    .scene-item.active { border-color:var(--acid); background:rgba(214,231,37,.12); }
    .hotspots { position:absolute; z-index:4; inset:0; pointer-events:none; overflow:hidden; }
    .hotspot { position:absolute; display:grid; place-items:center; width:34px; height:34px; padding:0; border:0; color:var(--ink); background:transparent; font:inherit; pointer-events:auto; }
    .hotspot[hidden] { display:none; }
    .hotspot-pin { position:relative; display:block; width:13px; height:13px; border:2px solid rgba(16,20,16,.76); border-radius:50%; background:var(--acid); box-shadow:0 0 0 2px rgba(214,231,37,.28),0 5px 14px rgba(0,0,0,.32); transition:transform .18s ease,box-shadow .18s ease; }
    .hotspot-pin::after { content:''; position:absolute; inset:-7px; border:1px solid rgba(214,231,37,.6); border-radius:50%; opacity:.72; animation:pinPulse 2.3s ease-out infinite; }
    .hotspot.annotation .hotspot-pin { background:#eef0eb; box-shadow:0 0 0 2px rgba(238,240,235,.23),0 5px 14px rgba(0,0,0,.32); }
    .hotspot.annotation .hotspot-pin::after { border-color:rgba(238,240,235,.55); }
    .hotspot-info { position:absolute; left:50%; bottom:calc(100% + 8px); width:max-content; max-width:220px; padding:8px 10px; transform:translate(-50%,6px) scale(.98); border:1px solid rgba(255,255,255,.17); border-radius:4px; color:var(--ink); background:rgba(12,15,16,.9); box-shadow:0 9px 24px rgba(0,0,0,.3); backdrop-filter:blur(8px); opacity:0; pointer-events:none; transition:opacity .16s ease,transform .16s ease; visibility:hidden; font-size:.75rem; line-height:1.3; text-align:left; }
    .hotspot-info strong { display:block; font-size:.78rem; }
    .hotspot-info small { display:block; margin-top:2px; color:var(--muted); font-size:.67rem; }
    .hotspot:hover .hotspot-pin, .hotspot:focus-visible .hotspot-pin { transform:scale(1.2); box-shadow:0 0 0 5px rgba(214,231,37,.19),0 5px 14px rgba(0,0,0,.32); }
    .hotspot:hover .hotspot-info, .hotspot:focus-visible .hotspot-info { transform:translate(-50%,0) scale(1); opacity:1; visibility:visible; }
    .hotspot:focus-visible { outline:2px solid var(--acid); outline-offset:2px; border-radius:50%; }
    @keyframes pinPulse { 0%,32% { transform:scale(.55); opacity:.8; } 72%,100% { transform:scale(1.35); opacity:0; } }
    .auto { height:42px; padding:0 14px; border-radius:24px; font-size:.73rem; font-weight:700; letter-spacing:.04em; }
    .auto.active { color:#101410; border-color:var(--acid); background:var(--acid); }
    .image-picker { display:none; }
    body.custom-panorama .directions { display:none; }
    .viewer.flat-view { cursor:default; }
    .viewer.flat-view .panorama, .viewer.flat-view .fallback { display:none; }
    .viewer.flat-view .directions, .viewer.flat-view #autoRotate, .viewer.flat-view .round { display:none; }
    body.focus-view .topbar, body.focus-view .scene-pill, body.focus-view .drawer, body.focus-view .hotspots, body.focus-view .bottom { display:none !important; }
    .scene-thumb { width:74px; height:48px; object-fit:cover; }
    .scene-item span { display:block; font-size:.72rem; color:var(--muted); margin-top:4px; }
    @media (max-width:680px) { .topbar { padding-top:18px; } .instruction { display:none; } .bottom { flex-direction:column; align-items:stretch; gap:14px; } .directions { display:grid; grid-template-columns:repeat(2,1fr); max-width:none; } .direction { min-width:0; } .controls { align-self:flex-end; } .scene-pill { bottom:auto; top:76px; } }
  </style>
</head>
<body>
  <main class="viewer" id="viewer" aria-label="Interactive XUP office interior panorama">
    <img class="fallback" id="fallback" src="assets/360_Render1.webp" alt="Panoramic render of the open workspace" />
    <canvas class="panorama" id="panorama" aria-label="Interactive 360 degree render of the new XUP office interior"></canvas>
    <img class="top-view" id="topViewImage" src="assets/top.webp" alt="Top-down floor plan of the XUP office" hidden />
    <header class="topbar">
      <div><div class="brand"><span class="mark">XUP</span> OFFICE INTERIOR</div><div class="scene-name" id="sceneName">Open workspace</div></div>
      <div class="instruction"><span class="hand"></span> Drag to look in any direction</div>
    </header>
    <button class="scene-pill" id="sceneToggle" aria-expanded="false" aria-controls="sceneDrawer"><span class="scene-dot" id="sceneNumber">01</span> View scenes</button>
    <aside class="drawer" id="sceneDrawer" aria-label="Available interior scenes">
      <h2>Office scenes</h2><p>Choose a point of view to explore the new office.</p>
      <button class="scene-item active" data-scene="0"><img class="scene-thumb" src="assets/360_Render1.webp" alt="" /><div>01 — Open workspace<span>Workstations</span></div></button>
      <button class="scene-item" data-scene="1"><img class="scene-thumb" src="assets/360_Render2.webp" alt="" /><div>02 — Reception & entry<span>Arrival area</span></div></button>
      <button class="scene-item" data-scene="2"><img class="scene-thumb" src="assets/360_Render3.webp" alt="" /><div>03 — Cozy Corner<span>Relaxed seating</span></div></button>
      <button class="scene-item" data-scene="3"><img class="scene-thumb" src="assets/360_Render4.webp" alt="" /><div>04 — Calling Pod<span>Private calls</span></div></button>
      <button class="scene-item" data-scene="4"><img class="scene-thumb" src="assets/360_Render5.webp" alt="" /><div>05 — Huddle Room<span>Small-team meetings</span></div></button>
      <button class="scene-item" id="topViewButton"><img class="scene-thumb" src="assets/top.webp" alt="" /><div>06 — Top view<span>Static floor plan</span></div></button>
    </aside>
    <div class="hotspots" id="hotspots" aria-live="polite"></div>
    <div class="bottom">
      <nav class="directions" aria-label="Jump to a viewpoint">
        <button class="direction" data-yaw="-105"><strong>West</strong>Lounge</button>
        <button class="direction active" data-yaw="0"><strong>North</strong>Think wall</button>
        <button class="direction" data-yaw="78"><strong>East</strong>Meeting room</button>
        <button class="direction" data-yaw="155"><strong>South</strong>Reception</button>
      </nav>
      <div class="controls"><input class="image-picker" id="imagePicker" type="file" accept="image/jpeg,image/png,image/webp,image/avif" /><button class="auto" id="openImage">Open 360 image</button><button class="auto" id="fullScreen" aria-pressed="false">Full screen</button><button class="auto" id="autoRotate" aria-pressed="false">Auto rotate</button><button class="round" id="zoomOut" aria-label="Zoom out">−</button><button class="round" id="reset" aria-label="Reset view">⌾</button><button class="round" id="zoomIn" aria-label="Zoom in">+</button></div>
    </div>
  </main>
  <script>
    const viewer=document.getElementById('viewer'), canvas=document.getElementById('panorama'), fallback=document.getElementById('fallback'), topViewImage=document.getElementById('topViewImage'), gl=canvas.getContext('webgl');
    const scenes=[
      {title:'Open workspace',detail:'Workstations',src:'assets/360_Render1.webp',alt:'360 degree view of the open workspace',hotspots:[
        {lon:0,lat:-10,label:'Open workspace',detail:'Flexible team desks'},
        {lon:-158,lat:-5,label:'Cozy Corner',detail:'Go to scene 03',target:2},
        {lon:139,lat:-3,label:'Reception and entry',detail:'Go to scene 02',target:1},
        {lon:117,lat:-1,label:'Calling Pod',detail:'Go to scene 04',target:3},
        {lon:67,lat:-6,label:'Huddle Room',detail:'Go to scene 05',target:4}

      {title:'Reception & entry',detail:'Arrival area',src:'assets/360_Render2.webp',alt:'360 degree view of the reception and entry',hotspots:[
        {lon:-26,lat:-2,label:'Cozy Corner',detail:'Go to scene 03',target:2},
        {lon:33,lat:-1,label:'Open workspace',detail:'Go to scene 01',target:0},
        {lon:60,lat:-4,label:'Huddle Room',detail:'Go to scene 05',target:4},
        {lon:94,lat:-4,label:'Calling Pod',detail:'Go to scene 04',target:3}

      {title:'Cozy Corner',detail:'Relaxed seating',src:'assets/360_Render3.webp',alt:'360 degree view of the cozy corner',hotspots:[

        {lon:61,lat:0,label:'Reception',detail:'Go to scene 02',target:1}

      {title:'Calling Pod',detail:'Private calls',src:'assets/360_Render4.webp',alt:'360 degree view of the calling pod',hotspots:[

        {lon:-20,lat:1,label:'Cozy Corner',detail:'Go to scene 03',target:2},

      {title:'Huddle Room',detail:'Small-team meetings',src:'assets/360_Render5.webp',alt:'360 degree view of the huddle room',hotspots:[

        {lon:-49,lat:-3,label:'Cozy Corner',detail:'Go to scene 03',target:2},

    let currentScene=0, customPanoramaUrl='';
    const buttons=[...document.querySelectorAll('.direction')], hotspotLayer=document.getElementById('hotspots'), autoButton=document.getElementById('autoRotate'), fullScreenButton=document.getElementById('fullScreen'), imagePicker=document.getElementById('imagePicker'), openImageButton=document.getElementById('openImage'), sceneName=document.getElementById('sceneName'), sceneNumber=document.getElementById('sceneNumber'), topViewButton=document.getElementById('topViewButton'); let yaw=0, pitch=0, fov=70, targetYaw=0, targetPitch=0, targetFov=70, autoRotate=false, dragging=false, startX, startY, originYaw, originPitch, dragAxis, animationFrame;
    const vertex=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;

    function shader(type, source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s}

    const texture=gl.createTexture(), maxTextureSize=gl.getParameter(gl.MAX_TEXTURE_SIZE), source=new Image();
    function textureSourceFor(image){const scale=Math.min(1,maxTextureSize/image.naturalWidth,maxTextureSize/image.naturalHeight);if(scale===1)return image;const resized=document.createElement('canvas'),width=Math.floor(image.naturalWidth*scale),height=Math.floor(image.naturalHeight*scale),context=resized.getContext('2d',{alpha:false});if(!context)return image;resized.width=width;resized.height=height;context.imageSmoothingEnabled=true;context.imageSmoothingQuality='high';context.drawImage(image,0,0,width,height);return resized}

    function resize(){const ratio=Math.min(devicePixelRatio||1,2),w=canvas.clientWidth*ratio,h=canvas.clientHeight*ratio;if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h)}}

    function choose(value){targetYaw=+value;targetPitch=0;buttons.forEach(b=>b.classList.toggle('active',+b.dataset.yaw===targetYaw))}
    function buildHotspots(){hotspotLayer.replaceChildren(...scenes[currentScene].hotspots.map((spot,index)=>{const isScene=Number.isInteger(spot.target),node=document.createElement(isScene?'button':'div');node.className=`hotspot${isScene?' scene-hotspot':' annotation'}`;node.dataset.hotspot=index;node.innerHTML=`<span class="hotspot-pin" aria-hidden="true"></span><span class="hotspot-info"><strong>${spot.label}</strong><small>${spot.detail}</small></span>`;if(isScene){node.type='button';node.setAttribute('aria-label',`${spot.label}. ${spot.detail}`);node.addEventListener('click',()=>selectScene(spot.target))}return node}))}

    function selectTopView(){releaseCustomPanorama();document.body.classList.remove('custom-panorama');viewer.classList.add('flat-view');topViewImage.hidden=false;currentScene=-1;setAutoRotate(false);sceneName.textContent='Top view';sceneNumber.textContent='06';document.querySelectorAll('.scene-item[data-scene]').forEach(item=>item.classList.remove('active'));topViewButton.classList.add('active');hotspotLayer.replaceChildren();yaw=targetYaw=0;pitch=targetPitch=0;fov=targetFov=70;choose(0)}
    function openLocalPanorama(file){if(!file||(file.type&&!file.type.startsWith('image/')))return;releaseCustomPanorama();viewer.classList.remove('flat-view');topViewImage.hidden=true;customPanoramaUrl=URL.createObjectURL(file);document.body.classList.add('custom-panorama');currentScene=-1;setAutoRotate(false);loadPanorama(customPanoramaUrl,`Local panorama: ${file.name}`);sceneName.textContent=file.name.replace(/\.[^/.]+$/,'')||'Local panorama';sceneNumber.textContent='↗';document.querySelectorAll('.scene-item').forEach(item=>item.classList.remove('active'));hotspotLayer.replaceChildren();yaw=targetYaw=0;pitch=targetPitch=0;fov=targetFov=70;choose(0)}
    buttons.forEach(button=>button.addEventListener('click',()=>choose(button.dataset.yaw)));
    viewer.addEventListener('pointerdown',event=>{if(viewer.classList.contains('flat-view')||event.target.closest('button'))return;setAutoRotate(false);const bounds=viewer.getBoundingClientRect(),edge=Math.min(event.clientX-bounds.left,bounds.right-event.clientX);dragging=true;dragAxis=edge<bounds.width*.18?'horizontal':null;viewer.classList.add('dragging');viewer.setPointerCapture(event.pointerId);startX=event.clientX;startY=event.clientY;originYaw=targetYaw;originPitch=targetPitch});
    viewer.addEventListener('pointermove',event=>{if(!dragging)return;const dx=event.clientX-startX,dy=event.clientY-startY;if(!dragAxis&&Math.hypot(dx,dy)>7)dragAxis=Math.abs(dx)>=Math.abs(dy)?'horizontal':'vertical';if(dragAxis==='horizontal')targetYaw=originYaw-dx*.105;if(dragAxis==='vertical')targetPitch=Math.max(-85,Math.min(85,originPitch-dy*.105));buttons.forEach(b=>b.classList.remove('active'))});
    viewer.addEventListener('pointerup',()=>{dragging=false;viewer.classList.remove('dragging')});
    viewer.addEventListener('wheel',event=>{if(viewer.classList.contains('flat-view'))return;event.preventDefault();targetFov=Math.max(42,Math.min(92,targetFov+event.deltaY*.025))},{passive:false});
    openImageButton.onclick=()=>imagePicker.click();imagePicker.addEventListener('change',()=>{openLocalPanorama(imagePicker.files[0]);imagePicker.value=''});fullScreenButton.onclick=toggleFullScreen;document.addEventListener('fullscreenchange',()=>setFocusView(Boolean(document.fullscreenElement)));document.addEventListener('keydown',event=>{if(event.key==='Escape')setFocusView(false)});autoButton.onclick=()=>setAutoRotate(!autoRotate);document.getElementById('zoomIn').onclick=()=>{targetFov=Math.max(42,targetFov-5)};document.getElementById('zoomOut').onclick=()=>{targetFov=Math.min(92,targetFov+5)};document.getElementById('reset').onclick=()=>{targetFov=70;choose(0)};window.addEventListener('resize',render);
    const toggle=document.getElementById('sceneToggle'), drawer=document.getElementById('sceneDrawer'); toggle.onclick=()=>{const open=drawer.classList.toggle('open');toggle.setAttribute('aria-expanded',open)};
    document.querySelectorAll('.scene-item[data-scene]').forEach(item=>item.onclick=()=>{selectScene(+item.dataset.scene);drawer.classList.remove('open');toggle.setAttribute('aria-expanded','false')});topViewButton.onclick=()=>{selectTopView();drawer.classList.remove('open');toggle.setAttribute('aria-expanded','false')};
    selectScene(0);
  </script>
</body>
</html>
